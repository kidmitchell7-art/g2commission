<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2 Construction Commission Tracker</title>

<style>
body { font-family: Arial, sans-serif; background:#f8f9fa; padding:20px; }
h1 { text-align:center; }
h1 span { color:blue; }
.container { max-width:900px; margin:auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 0 8px rgba(0,0,0,.1); }
label { margin-top:10px; display:block; }
input, select, button { width:100%; padding:8px; margin-top:5px; }
button { font-weight:bold; cursor:pointer; }
.delete-btn { background:#dc3545; color:white; }
#history .job { border-bottom:1px solid #eee; padding:10px 0; display:flex; justify-content:space-between; }
.filter-container { display:flex; gap:10px; flex-wrap:wrap; }
</style>
</head>

<body>

<h1>G<span>2</span> Construction Commission Tracker</h1>

<div class="container">

<label>Profile</label>
<select id="profileSelect">
  <option value="David">David</option>
  <option value="Joseph">Joseph</option>
  <option value="ViewAll">View All</option>
</select>

<label>Job Name</label>
<input id="jobName">

<label>Sold Amount</label>
<input id="sale" type="number">

<label>Cost</label>
<input id="cost" type="number">

<button id="calcBtn">Calculate Commission</button>
<div id="results"></div>

<button id="saveBtn">Save Job</button>
<button id="recalcBtn" style="background:#ffc107;">Recalculate Existing Jobs (20% Rule)</button>

<h3>Job History</h3>

<div class="filter-container">
  <input id="filterJobName" placeholder="Filter Job Name">
  <select id="filterProfile">
    <option value="">All Profiles</option>
    <option>David</option>
    <option>Joseph</option>
  </select>
</div>

<div id="history">Loading…</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* =======================
   FIREBASE INIT
======================= */
firebase.initializeApp({
  apiKey: "AIzaSyAfbryRypCrosHxxf3STmES7twq2fGVP1Y",
  authDomain: "g2-construction-commissi-35729.firebaseapp.com",
  projectId: "g2-construction-commissi-35729"
});
const db = firebase.firestore();

/* =======================
   ELEMENTS
======================= */
const profileSelect = document.getElementById("profileSelect");
const jobEl = document.getElementById("jobName");
const saleEl = document.getElementById("sale");
const costEl = document.getElementById("cost");
const resultsEl = document.getElementById("results");
const historyEl = document.getElementById("history");
const filterJobName = document.getElementById("filterJobName");
const filterProfile = document.getElementById("filterProfile");

let editingId = null;

/* =======================
   COMMISSION LOGIC
   40% over 20%
======================= */
function calculate(sale, cost){
  sale = Number(sale) || 0;
  cost = Number(cost) || 0;
  const profit = Math.max(0, sale - cost);
  const eligible = Math.max(0, profit - (sale * 0.20));
  return {
    profit,
    eligible,
    commission: eligible * 0.40
  };
}

/* =======================
   CALCULATE PREVIEW
======================= */
document.getElementById("calcBtn").onclick = () => {
  const r = calculate(saleEl.value, costEl.value);
  resultsEl.innerHTML =
    `Profit: $${r.profit.toFixed(2)}<br>
     Eligible: $${r.eligible.toFixed(2)}<br>
     Commission: $${r.commission.toFixed(2)}`;
};

/* =======================
   SAVE JOB (SAFE)
======================= */
document.getElementById("saveBtn").onclick = async () => {
  if(profileSelect.value === "ViewAll") return alert("Select a profile");
  if(!jobEl.value.trim()) return alert("Enter job name");

  const r = calculate(saleEl.value, costEl.value);

  const data = {
    profile: profileSelect.value,
    jobName: jobEl.value.trim(),
    sale: Number(saleEl.value) || 0,
    cost: Number(costEl.value) || 0,
    profit: r.profit,
    eligible: r.eligible,
    commission: r.commission,
    created: firebase.firestore.FieldValue.serverTimestamp()
  };

  if(editingId){
    await db.collection("jobs").doc(editingId).set(data, { merge:true });
  } else {
    await db.collection("jobs").add(data);
  }

  editingId = null;
  jobEl.value = saleEl.value = costEl.value = "";
  resultsEl.innerHTML = "";
  loadJobs();
};

/* =======================
   LOAD JOBS (FIXED)
======================= */
async function loadJobs(){
  historyEl.innerHTML = "Loading…";
  const snap = await db.collection("jobs").get();
  historyEl.innerHTML = "";

  if(snap.empty){
    historyEl.textContent = "No jobs found.";
    return;
  }

  snap.forEach(doc => {
    const j = doc.data();
    if(!j.jobName) return;

    if(filterProfile.value && j.profile !== filterProfile.value) return;
    if(filterJobName.value &&
       !j.jobName.toLowerCase().includes(filterJobName.value.toLowerCase())) return;

    const div = document.createElement("div");
    div.className = "job";
    div.innerHTML = `
      <div>
        <b>${j.jobName}</b> (${j.profile})<br>
        Sale: $${(j.sale||0).toFixed(2)} |
        Profit: $${(j.profit||0).toFixed(2)} |
        Commission: $${(j.commission||0).toFixed(2)}
      </div>
      <div>
        <button data-edit="${doc.id}">Edit</button>
        <button class="delete-btn" data-delete="${doc.id}">Delete</button>
      </div>
    `;
    historyEl.appendChild(div);
  });

  /* Button bindings */
  document.querySelectorAll("[data-edit]").forEach(btn=>{
    btn.onclick = () => editJob(btn.dataset.edit);
  });
  document.querySelectorAll("[data-delete]").forEach(btn=>{
    btn.onclick = () => deleteJob(btn.dataset.delete);
  });
}

/* =======================
   EDIT / DELETE
======================= */
async function editJob(id){
  const doc = await db.collection("jobs").doc(id).get();
  if(!doc.exists) return;
  const j = doc.data();
  editingId = id;
  jobEl.value = j.jobName;
  saleEl.value = j.sale;
  costEl.value = j.cost;
  profileSelect.value = j.profile;
}

async function deleteJob(id){
  if(!confirm("Delete this job?")) return;
  await db.collection("jobs").doc(id).delete();
  loadJobs();
}

/* =======================
   RE-CALCULATE ALL
======================= */
document.getElementById("recalcBtn").onclick = async () => {
  if(!confirm("Recalculate ALL jobs to the 20% rule?")) return;
  const snap = await db.collection("jobs").get();
  const batch = db.batch();

  snap.forEach(doc=>{
    const j = doc.data();
    const r = calculate(j.sale, j.cost);
    batch.set(doc.ref, r, { merge:true });
  });

  await batch.commit();
  alert("All jobs recalculated.");
  loadJobs();
};

/* Filters */
filterJobName.oninput = loadJobs;
filterProfile.onchange = loadJobs;
profileSelect.onchange = loadJobs;

/* Initial Load (AFTER Firebase ready) */
loadJobs();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2 Construction Commission Tracker</title>

<style>
body { font-family: Arial, sans-serif; background:#f8f9fa; padding:20px; }
h1 { text-align:center; }
h1 span { color:blue; }
.container { max-width:900px; margin:auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 0 8px rgba(0,0,0,.1); }
label { margin-top:10px; display:block; }
input, select, button { width:100%; padding:8px; margin-top:5px; }
button { cursor:pointer; font-weight:bold; }
.delete-btn { background:#dc3545; color:white; }
#history div { border-bottom:1px solid #eee; padding:10px 0; display:flex; justify-content:space-between; gap:10px; }
.filter-container { display:flex; gap:10px; flex-wrap:wrap; }
</style>
</head>

<body>

<h1>G<span>2</span> Construction Commission Tracker</h1>

<div class="container">

<label>Profile</label>
<select id="profileSelect">
  <option value="David">David</option>
  <option value="Joseph">Joseph</option>
  <option value="ViewAll">View All</option>
</select>

<label>Job Name</label>
<input id="jobName">

<label>Sold Amount</label>
<input id="sale" type="number">

<label>Cost</label>
<input id="cost" type="number">

<button id="calcBtn">Calculate Commission</button>
<div id="results"></div>

<button id="saveBtn">Save Job</button>
<button id="recalcBtn" style="background:#ffc107">Recalculate Existing Jobs (20% Rule)</button>

<h3>Job History</h3>

<div class="filter-container">
  <input id="filterJobName" placeholder="Filter Job Name">
  <select id="filterProfile">
    <option value="">All Profiles</option>
    <option>David</option>
    <option>Joseph</option>
  </select>
</div>

<div id="history">Loading...</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* Firebase */
firebase.initializeApp({
  apiKey: "AIzaSyAfbryRypCrosHxxf3STmES7twq2fGVP1Y",
  authDomain: "g2-construction-commissi-35729.firebaseapp.com",
  projectId: "g2-construction-commissi-35729"
});
const db = firebase.firestore();

/* Elements */
const profileSelect = document.getElementById("profileSelect");
const jobEl = document.getElementById("jobName");
const saleEl = document.getElementById("sale");
const costEl = document.getElementById("cost");
const resultsEl = document.getElementById("results");
const historyEl = document.getElementById("history");
const filterJobName = document.getElementById("filterJobName");
const filterProfile = document.getElementById("filterProfile");

let editingId = null;

/* Commission Math — 40% over 20% */
function calc(sale, cost){
  const profit = Math.max(0, sale - cost);
  const eligible = Math.max(0, profit - (sale * 0.20));
  return {
    profit,
    eligible,
    commission: eligible * 0.40
  };
}

/* Preview */
document.getElementById("calcBtn").onclick = () => {
  const r = calc(+saleEl.value||0, +costEl.value||0);
  resultsEl.innerHTML =
    `Profit: $${r.profit.toFixed(2)}<br>
     Eligible: $${r.eligible.toFixed(2)}<br>
     Commission: $${r.commission.toFixed(2)}`;
};

/* Save */
document.getElementById("saveBtn").onclick = async () => {
  if(profileSelect.value==="ViewAll") return alert("Select a profile");
  if(!jobEl.value.trim()) return alert("Enter job name");

  const r = calc(+saleEl.value||0, +costEl.value||0);

  const data = {
    profile: profileSelect.value,
    jobName: jobEl.value,
    sale: +saleEl.value||0,
    cost: +costEl.value||0,
    ...r,
    created: firebase.firestore.FieldValue.serverTimestamp()
  };

  editingId
    ? await db.collection("jobs").doc(editingId).update(data)
    : await db.collection("jobs").add(data);

  editingId=null;
  jobEl.value=saleEl.value=costEl.value="";
  resultsEl.innerHTML="";
  loadJobs();
};

/* Load Jobs */
async function loadJobs(){
  historyEl.innerHTML="";
  const snap = await db.collection("jobs").get();
  if(snap.empty){ historyEl.textContent="No jobs"; return; }

  snap.forEach(doc=>{
    const j = doc.data();

    if(filterProfile.value && j.profile!==filterProfile.value) return;
    if(filterJobName.value && !j.jobName.toLowerCase().includes(filterJobName.value.toLowerCase())) return;

    const div = document.createElement("div");
    div.innerHTML = `
      <div>
        <b>${j.jobName}</b> (${j.profile})<br>
        Sale: $${j.sale.toFixed(2)} |
        Profit: $${j.profit.toFixed(2)} |
        Commission: $${j.commission.toFixed(2)}
      </div>
      <div>
        <button onclick="editJob('${doc.id}')">Edit</button>
        <button class="delete-btn" onclick="deleteJob('${doc.id}')">Delete</button>
      </div>`;
    historyEl.appendChild(div);
  });
}

/* Edit */
window.editJob = async id => {
  const d = await db.collection("jobs").doc(id).get();
  const j = d.data();
  editingId=id;
  jobEl.value=j.jobName;
  saleEl.value=j.sale;
  costEl.value=j.cost;
  profileSelect.value=j.profile;
};

/* Delete */
window.deleteJob = async id => {
  if(confirm("Delete this job?")){
    await db.collection("jobs").doc(id).delete();
    loadJobs();
  }
};

/* Recalculate Existing */
document.getElementById("recalcBtn").onclick = async () => {
  if(!confirm("Recalculate ALL jobs to 20% rule?")) return;
  const snap = await db.collection("jobs").get();
  const batch = db.batch();
  snap.forEach(doc=>{
    const j = doc.data();
    const r = calc(j.sale||0, j.cost||0);
    batch.update(doc.ref, r);
  });
  await batch.commit();
  alert("Recalculation complete");
  loadJobs();
};

filterJobName.oninput = loadJobs;
filterProfile.onchange = loadJobs;
profileSelect.onchange = loadJobs;

loadJobs();
</script>

</body>
</html>

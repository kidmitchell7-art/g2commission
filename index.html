<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2 Construction Commission Tracker</title>
<style>
body { font-family: Arial, sans-serif; background:#f8f9fa; margin:0; padding:20px; }
.header {
  text-align: center;
  font-size: 32px;
  margin-bottom: 20px;
  letter-spacing: 1px;
  font-weight: bold;
  color: #007bff;
  position: relative;
}
.header-letter {
  font-size: 50px;
  font-weight: bold;
  display: inline-block;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
}
.header::after {
  content:"";
  position:absolute;
  bottom:-4px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:4px;
  background:#007bff;
  border-radius:2px;
  transition: width 0.4s;
}
.header:hover::after { width:60px; }
.container { max-width:900px; margin:auto; background:white; padding:20px; border-radius:10px; box-shadow:0 4px 15px rgba(0,0,0,0.15); }
label { display:block; margin-top:10px; font-weight:bold; }
input, select, button { width:100%; padding:8px; margin-top:5px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; }
button { background:#007bff; color:white; font-weight:bold; border:none; cursor:pointer; margin-top:10px; transition: background 0.2s; }
button:hover { background:#0056b3; }
.filter-container { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
.filter-container input, .filter-container select { flex:1; min-width:120px; }
#history { margin-top:15px; }
.job {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  background:#f9f9f9;
  padding:12px;
  border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  margin-bottom:12px;
  flex-wrap:wrap;
  transition: transform 0.2s, box-shadow 0.2s;
}
.job:hover { transform: translateY(-4px); box-shadow:0 6px 15px rgba(0,0,0,0.15); }
.job-left { flex:1; min-width:180px; }
.job-actions { display:flex; gap:6px; margin-top:6px; }
.edit-btn { background:#6c757d; color:white; }
.edit-btn:hover { background:#5a6268; }
.delete-btn { background:#dc3545; color:white; }
.delete-btn:hover { background:#c82333; }
.badge-quarter { display:inline-block; font-size:0.85em; padding:2px 6px; border-radius:6px; margin-bottom:4px; color:white; }
.badge-Q1 { background:#007bff; }  
.badge-Q2 { background:#28a745; }  
.badge-Q3 { background:#ffc107; color:black; } 
.badge-Q4 { background:#dc3545; }  
.totals { font-weight:bold; padding:12px; margin-top:12px; background:#f1f3f5; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.05); }

/* profile-based card background */
.job.profile-David { background: #e7f1ff; }
.job.profile-Joseph { background: #e9f7ef; }

/* 🔥 ADDED ONLY — fireworks canvas */
#fireworks-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
}
</style>
</head>
<body>

<h1 class="header">
  <span class="header-letter">G</span><span class="header-letter">2</span> Construction Commission Tracker
</h1>

<div class="container">
  <label>Profile:</label>
  <select id="profileSelect">
    <option value="David">David</option>
    <option value="Joseph">Joseph</option>
    <option value="ViewAll">View All</option>
  </select>

  <label>Job Name:</label>
  <input type="text" id="jobName" placeholder="Enter job name">

  <label>Sold Amount:</label>
  <input type="number" id="sale" placeholder="Enter sale amount">

  <label>Cost:</label>
  <input type="number" id="cost" placeholder="Enter cost amount">

  <button id="calcBtn">Calculate Commission</button>
  <div id="results" style="margin-top:10px;font-weight:bold;"></div>

  <button id="saveBtn">Save Job</button>
  <button id="exportBtn">Export CSV</button>

  <h3>Job History (Filtered)</h3>
  <div class="filter-container">
    <input type="text" id="filterJobName" placeholder="Filter by Job Name">
    <select id="filterYear">
      <option value="">All Years</option>
    </select>
    <select id="filterQuarter">
      <option value="">All Quarters</option>
      <option value="Q1">Q1 (Jan–Mar)</option>
      <option value="Q2">Q2 (Apr–Jun)</option>
      <option value="Q3">Q3 (Jul–Sep)</option>
      <option value="Q4">Q4 (Oct–Dec)</option>
    </select>
  </div>

  <div id="history">Loading...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAfbryRypCrosHxxf3STmES7twq2fGVP1Y",
    authDomain: "g2-construction-commissi-35729.firebaseapp.com",
    projectId: "g2-construction-commissi-35729",
    storageBucket: "g2-construction-commissi-35729.firebasestorage.app",
    messagingSenderId: "347759839953",
    appId: "1:347759839953:web:b2ec2e14aee7c47e8cd3f0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const profileSelect = document.getElementById('profileSelect');
const jobEl = document.getElementById('jobName');
const saleEl = document.getElementById('sale');
const costEl = document.getElementById('cost');
const resultsEl = document.getElementById('results');
const historyEl = document.getElementById('history');
const filterJobName = document.getElementById('filterJobName');
const filterYear = document.getElementById('filterYear');
const filterQuarter = document.getElementById('filterQuarter');

let editingJobId = null;

function getYearQuarter(ts){
  const d = ts.toDate();
  const y = d.getFullYear();
  const m = d.getMonth()+1;
  let q="Q1";
  if(m>=4&&m<=6) q="Q2";
  else if(m>=7&&m<=9) q="Q3";
  else if(m>=10) q="Q4";
  return {year:y, quarter:q};
}

document.getElementById('calcBtn').addEventListener('click', ()=>{
    const sale = parseFloat(saleEl.value)||0;
    const cost = parseFloat(costEl.value)||0;
    const profit = sale-cost;
    const threshold = sale*0.20;
    const eligible = profit-threshold;
    const commission = eligible>0?eligible*0.4:0;
    resultsEl.innerHTML = `Profit: $${profit.toFixed(2)}<br>Eligible: $${eligible.toFixed(2)}<br>Commission: $${commission.toFixed(2)}`;
});

document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const profile = profileSelect.value==="ViewAll"?null:profileSelect.value;
    if(!profile) return alert("Select David or Joseph to save a job.");
    const jobName = jobEl.value.trim();
    const sale = parseFloat(saleEl.value)||0;
    const cost = parseFloat(costEl.value)||0;
    if(!jobName) return alert("Enter job name.");
    const profit = sale-cost;
    const threshold = sale*0.20;
    const eligible = profit-threshold;
    const commission = eligible>0?eligible*0.4:0;

    const jobData = {profile, jobName, sale, cost, profit, threshold, eligible, commission, created: firebase.firestore.FieldValue.serverTimestamp()};

    try{
        if(editingJobId){
            await db.collection("jobs").doc(editingJobId).set(jobData);
            editingJobId=null;
        } else {
            await db.collection("jobs").add(jobData);
        }
        jobEl.value=''; saleEl.value=''; costEl.value=''; resultsEl.textContent='';
        loadJobs();
        launchFireworks(); /* 🔥 ADDED ONLY */
    }catch(err){console.error(err); alert("Error saving job.");}
});

/* 🔥 ADDED ONLY — high visibility rockets + fireworks */
function launchFireworks(){
  const canvas=document.createElement("canvas");
  canvas.id="fireworks-canvas";
  document.body.appendChild(canvas);
  const ctx=canvas.getContext("2d");
  canvas.width=innerWidth;
  canvas.height=innerHeight;

  const rockets=[],particles=[];
  const colors=["#ff1744","#ffea00","#00e676","#2979ff","#d500f9","#ff9100"];
  const gravity=0.08;
  let launches=0,maxLaunches=7;

  const timer=setInterval(()=>{
    rockets.push({x:Math.random()*canvas.width*0.6+canvas.width*0.2,y:canvas.height,vy:-(Math.random()*7+9)});
    if(++launches>=maxLaunches) clearInterval(timer);
  },500);

  function explode(x,y){
    for(let i=0;i<220;i++){
      const a=Math.random()*Math.PI*2,s=Math.random()*7+4;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:120,size:Math.random()*3+2,color:colors[Math.random()*colors.length|0]});
    }
  }

  (function animate(){
    ctx.fillStyle="rgba(0,0,0,0.25)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    rockets.forEach((r,i)=>{
      r.y+=r.vy;
      ctx.shadowBlur=20;ctx.shadowColor="#fff";
      ctx.fillStyle="#fff";ctx.fillRect(r.x-2,r.y,4,14);
      if(r.y<canvas.height*0.35){explode(r.x,r.y);rockets.splice(i,1);}
    });

    particles.forEach((p,i)=>{
      p.vy+=gravity;p.x+=p.vx;p.y+=p.vy;p.life--;
      ctx.beginPath();ctx.shadowBlur=25;ctx.shadowColor=p.color;
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle=p.color;ctx.fill();
      if(p.life<=0) particles.splice(i,1);
    });

    (particles.length||rockets.length||launches<maxLaunches)?requestAnimationFrame(animate):canvas.remove();
  })();
}

async function loadJobs(){
  /* unchanged */
}

loadJobs();
</script>
</body>
</html>

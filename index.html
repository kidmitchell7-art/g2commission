<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2 Construction Commission Tracker</title>

<style>
body { font-family: Arial, sans-serif; background:#f8f9fa; padding:20px; }
h1 { text-align:center; }
h1 span { color:blue; }
.container { max-width:900px; margin:auto; background:white; padding:20px; border-radius:8px; box-shadow:0 0 8px rgba(0,0,0,.1); }
label { display:block; margin-top:10px; }
input, select, button { width:100%; padding:8px; margin-top:5px; }
button { font-weight:bold; cursor:pointer; }
.delete-btn { background:#dc3545; color:white; }
.job { border-bottom:1px solid #eee; padding:10px 0; display:flex; justify-content:space-between; }
.actions button { width:auto; margin-left:5px; }
</style>
</head>

<body>

<h1>G<span>2</span> Construction Commission Tracker</h1>

<div class="container">

<label>Profile</label>
<select id="profile">
  <option>David</option>
  <option>Joseph</option>
</select>

<label>Job Name</label>
<input id="job">

<label>Sold Amount</label>
<input id="sale" type="number">

<label>Cost</label>
<input id="cost" type="number">

<button id="calc">Calculate</button>
<div id="result"></div>

<button id="save">Save Job</button>
<button id="recalc" style="background:#ffc107;">Recalculate Existing Jobs</button>

<h3>Jobs</h3>
<div id="history">Loading…</div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* FIREBASE */
firebase.initializeApp({
  apiKey: "AIzaSyAfbryRypCrosHxxf3STmES7twq2fGVP1Y",
  authDomain: "g2-construction-commissi-35729.firebaseapp.com",
  projectId: "g2-construction-commissi-35729"
});
const db = firebase.firestore();

/* ELEMENTS */
const historyEl = document.getElementById("history");
let editId = null;

/* COMMISSION — 40% OVER 20% */
function calc(sale, cost){
  sale = Number(sale)||0;
  cost = Number(cost)||0;
  const profit = Math.max(0, sale - cost);
  const eligible = Math.max(0, profit - sale * 0.20);
  return { profit, eligible, commission: eligible * 0.40 };
}

/* CALCULATE */
document.getElementById("calc").onclick = () => {
  const r = calc(sale.value, cost.value);
  result.innerHTML =
    `Profit: $${r.profit.toFixed(2)}<br>
     Eligible: $${r.eligible.toFixed(2)}<br>
     Commission: $${r.commission.toFixed(2)}`;
};

/* SAVE */
document.getElementById("save").onclick = async () => {
  if(!job.value.trim()) return alert("Enter job name");
  const r = calc(sale.value, cost.value);

  const data = {
    profile: profile.value,
    jobName: job.value.trim(),
    sale: Number(sale.value)||0,
    cost: Number(cost.value)||0,
    ...r,
    created: firebase.firestore.FieldValue.serverTimestamp()
  };

  editId
    ? await db.collection("jobs").doc(editId).set(data, { merge:true })
    : await db.collection("jobs").add(data);

  editId = null;
  job.value = sale.value = cost.value = "";
  result.innerHTML = "";
};

/* REAL-TIME LOAD (THIS FIXES EVERYTHING) */
db.collection("jobs").onSnapshot(snap => {
  historyEl.innerHTML = "";
  if(snap.empty){ historyEl.textContent="No jobs"; return; }

  snap.forEach(doc => {
    const j = doc.data();
    const div = document.createElement("div");
    div.className = "job";
    div.dataset.id = doc.id;
    div.innerHTML = `
      <div>
        <b>${j.jobName}</b> (${j.profile})<br>
        Sale: $${j.sale.toFixed(2)} |
        Profit: $${j.profit.toFixed(2)} |
        Commission: $${j.commission.toFixed(2)}
      </div>
      <div class="actions">
        <button data-edit>Edit</button>
        <button class="delete-btn" data-delete>Delete</button>
      </div>`;
    historyEl.appendChild(div);
  });
});

/* EVENT DELEGATION (EDIT / DELETE ALWAYS WORK) */
historyEl.onclick = async e => {
  const jobDiv = e.target.closest(".job");
  if(!jobDiv) return;
  const id = jobDiv.dataset.id;

  if(e.target.dataset.edit !== undefined){
    const doc = await db.collection("jobs").doc(id).get();
    const j = doc.data();
    editId = id;
    job.value = j.jobName;
    sale.value = j.sale;
    cost.value = j.cost;
    profile.value = j.profile;
  }

  if(e.target.dataset.delete !== undefined){
    if(confirm("Delete this job?")){
      await db.collection("jobs").doc(id).delete();
    }
  }
};

/* RE-CALCULATE ALL */
document.getElementById("recalc").onclick = async () => {
  if(!confirm("Recalculate ALL jobs to 20% rule?")) return;
  const snap = await db.collection("jobs").get();
  const batch = db.batch();
  snap.forEach(doc=>{
    const j = doc.data();
    batch.set(doc.ref, calc(j.sale, j.cost), { merge:true });
  });
  await batch.commit();
  alert("Recalculation complete");
};
</script>

</body>
</html>
